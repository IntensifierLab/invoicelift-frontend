<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="fillGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#00E676"/>
      <stop offset="100%" stop-color="#69F0AE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
    <!-- Test tube clip shape -->
    <clipPath id="tube">
      <path d="M 158 88 L 242 88 L 242 292 Q 242 348 200 348 Q 158 348 158 292 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="72" fill="#0d0d0d"/>

  <!-- Ambient glow behind tube -->
  <ellipse cx="200" cy="280" rx="80" ry="100" fill="#00E676" opacity="0.06"/>

  <!-- Test tube outer stroke -->
  <path d="M 158 88 L 242 88 L 242 292 Q 242 348 200 348 Q 158 348 158 292 Z"
        fill="none" stroke="#00E676" stroke-width="9" stroke-linejoin="round"/>

  <!-- Fill level — liquid (approx 68% from bottom) -->
  <rect x="158" y="160" width="84" height="192"
        fill="url(#fillGrad)" clip-path="url(#tube)"/>

  <!-- Glow wash above fill level -->
  <rect x="158" y="120" width="84" height="44"
        fill="url(#glowGrad)" clip-path="url(#tube)"/>

  <!-- Fill level top line -->
  <line x1="161" y1="160" x2="239" y2="160"
        stroke="#00E676" stroke-width="2.5" opacity="0.55" clip-path="url(#tube)"/>

  <!-- Bubbles in fill -->
  <circle cx="185" cy="255" r="7"  fill="#0d0d0d" opacity="0.35" clip-path="url(#tube)"/>
  <circle cx="213" cy="290" r="5"  fill="#0d0d0d" opacity="0.28" clip-path="url(#tube)"/>
  <circle cx="198" cy="310" r="4"  fill="#0d0d0d" opacity="0.22" clip-path="url(#tube)"/>

  <!-- Measurement ticks — right side -->
  <line x1="242" y1="188" x2="262" y2="188" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
  <line x1="242" y1="228" x2="255" y2="228" stroke="#00E676" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="242" y1="268" x2="262" y2="268" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
  <line x1="242" y1="308" x2="255" y2="308" stroke="#00E676" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Tube opening rim -->
  <line x1="148" y1="88" x2="252" y2="88"
        stroke="#00E676" stroke-width="9" stroke-linecap="round"/>

  <!-- Tiny rim lip detail -->
  <line x1="163" y1="73" x2="237" y2="73"
        stroke="#00E676" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
</svg>
